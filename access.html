<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acceso · Tablero Riwi</title><link rel="stylesheet" href="/ui.css"><script defer src="/access.js"></script></head><body><main class="app-main"><section class="card"><h1 id="access-title">Recuperar contraseña</h1><p id="access-description">Usa la cédula y el correo verificado que guardaste en el registro. El enlace llegará únicamente a ese correo.</p><form id="access-form">
<div id="recovery-fields"><label>Cédula<input name="document" inputmode="numeric" pattern="[0-9]{5,12}" maxlength="12" required></label><label>Correo del registro<input name="email" type="email" maxlength="254" autocomplete="email" required></label></div>
<fieldset id="reset-fields" hidden disabled><label>Nueva contraseña<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><label>Confirmar contraseña<input name="confirmation" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label><p>Entre 8 y 72 caracteres, una letra, un número, sin espacios al inicio o al final y sin tu cédula.</p></fieldset>
<button id="access-submit">Solicitar enlace</button></form><p id="access-status" role="status"></p><p><a href="/login">Volver al ingreso</a> · <a href="/privacy">Privacidad</a></p></section></main></body></html>
