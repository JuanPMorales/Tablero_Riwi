<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi tablero Riwi · V1.0 Beta</title>
  <link rel="stylesheet" href="/ui.css">
  <script defer src="/chat-blocks.js"></script>
  <script defer src="/ui.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">R</span><div><h1>Mi tablero Riwi</h1><small>Desarrollo de Software · Clan Ritchie</small></div></div>
    <div class="row"><a class="button outline" href="https://moodle.riwi.io/course/view.php?id=137" target="_blank" rel="noopener noreferrer">Moodle Riwi ↗</a><button id="logout" class="outline" type="button">Cerrar sesión</button></div>
  </header>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar-nav" aria-expanded="true">
          <span class="menu-icon" aria-hidden="true">☰</span><span id="menu-label">Contraer menú</span>
        </button>
        <nav id="sidebar-nav" aria-label="Secciones">
          <button type="button" data-tab="check" title="Hoy / Checklist" aria-current="page"><span class="menu-icon" aria-hidden="true">✓</span><span class="menu-text">Hoy / Checklist</span></button>
          <button type="button" data-tab="calendar" title="Calendario Ritchie"><span class="menu-icon" aria-hidden="true">▦</span><span class="menu-text">Calendario Ritchie</span></button>
          <button type="button" data-tab="inbox" title="Avisos"><span class="menu-icon" aria-hidden="true">◉</span><span class="menu-text">Avisos</span></button>
          <button type="button" data-tab="history" title="Historial"><span class="menu-icon" aria-hidden="true">↺</span><span class="menu-text">Historial</span></button>
          <button type="button" data-tab="chat" title="Chat Riwi"><span class="menu-icon" aria-hidden="true">⋯</span><span class="menu-text">Chat Riwi</span></button>
        </nav>
        <div class="sidebar-progress" id="sidebar-progress" hidden></div>
      </div>
    </aside>
    <main>
      <p id="status" class="status" role="status">Cargando tu tablero…</p>
      <div id="sources"></div>
      <section id="check" aria-label="Hoy y checklist" hidden></section>
      <section id="calendar" aria-label="Calendario Ritchie" hidden></section>
      <section id="inbox" aria-label="Avisos" hidden></section>
      <section id="history" aria-label="Historial" hidden>
        <h2>Historial de estudio</h2>
        <div id="history-summary" class="history-summary"></div>
        <div class="card history-filters">
          <label>Buscar día<input id="history-search" type="search" placeholder="Tema, semana o día"></label>
          <label>Módulo<select id="history-module"><option value="">Todos</option></select></label>
          <label>Estado<select id="history-status">
            <option value="">Todos</option><option>Completado</option><option>Reabierto</option>
            <option>En curso</option><option>Pendiente</option><option>Checklist pendiente de verificar</option>
          </select></label>
        </div>
        <p id="history-count" class="muted" role="status"></p>
        <div id="history-records" class="history-records"></div>
      </section>
      <section id="chat" aria-label="Chat Riwi" hidden>
        <h2 id="chat-title">Chat Riwi</h2>
        <details class="card" open>
          <summary>Conversaciones</summary>
          <label for="chat-search">Buscar conversación</label>
          <input id="chat-search" type="search" placeholder="Título o tema">
          <ul id="chat-list" aria-label="Conversaciones guardadas"></ul>
          <form id="new-chat-form">
            <label for="new-chat-title">Título de la nueva conversación</label>
            <input id="new-chat-title" maxlength="100" required>
            <button type="submit" class="secondary">Nueva conversación</button>
          </form>
        </details>
        <div id="chat-context"></div>
        <details class="card" id="chat-connection">
          <summary>Conectar un modelo</summary>
          <form id="model-form">
            <label for="provider">Proveedor</label>
            <select id="provider">
              <option value="groq">Groq · plan gratuito disponible</option>
              <option value="gemini">Google Gemini · clave de API</option>
              <option value="google-cloud">Google Cloud · cuenta de Google</option>
              <option value="openai">OpenAI · clave de API</option>
              <option value="claude">Claude · clave de API</option>
              <option value="ollama">Ollama en este dispositivo</option>
              <option value="agent">Agente local · API compatible con OpenAI</option>
            </select>
            <ol id="provider-steps"></ol>
            <label for="model">Nombre del modelo o agente</label>
            <input id="model" required maxlength="120" autocomplete="off">
            <div id="project-field" hidden>
              <label for="project">ID del proyecto de Google Cloud</label>
              <input id="project" maxlength="30" autocomplete="off">
            </div>
            <div id="credential-field">
              <label for="credential">Clave de API</label>
              <input type="password" id="credential" maxlength="4096" autocomplete="off">
            </div>
            <div id="port-field" hidden>
              <label for="local-port">Puerto local</label>
              <input type="number" id="local-port" min="1" max="65535">
            </div>
            <label id="usage-field" class="check"><input type="checkbox" id="usage-consent"> <span>Autorizo enviar al proveedor el contexto y el historial de este chat. Se usará mi cuota o saldo y pueden generarse cargos.</span></label>
            <div class="row"><button id="connect-model" type="submit">Conectar</button><button id="disconnect-model" type="button" class="secondary" hidden>Desconectar</button></div>
            <p id="connection-status" role="status" class="status"></p>
          </form>
        </details>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="ask" class="card">
          <p id="active-model" class="muted">Conecta un modelo para enviar preguntas.</p>
          <label for="question">Tu pregunta</label>
          <textarea id="question" maxlength="4000" required placeholder="Escribe tu pregunta sobre este día"></textarea>
          <input id="chat-file" type="file" hidden>
          <button id="attach-chat-file" type="button" class="secondary">Adjuntar archivo de texto</button>
          <button id="send" disabled>Enviar pregunta</button>
          <button id="cancel-chat" type="button" class="secondary" hidden>Cancelar respuesta</button>
          <button id="delete-chat" type="button" class="danger" hidden>Eliminar conversación</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
