<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi tablero Riwi · V1.0 Beta</title>
  <link rel="stylesheet" href="/ui.css">
  <script defer src="/ui.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">R</span><div><h1>Mi tablero Riwi</h1><small>Desarrollo de Software · Clan Ritchie</small></div></div>
    <div class="row"><a class="button outline" href="https://moodle.riwi.io/course/view.php?id=137" target="_blank" rel="noopener noreferrer">Moodle Riwi ↗</a><button id="logout" class="outline" type="button">Cerrar sesión</button></div>
  </header>
  <div class="layout">
    <nav aria-label="Secciones">
      <button type="button" data-tab="check" aria-current="page"><span aria-hidden="true">✓</span><span>Hoy / Checklist</span></button>
      <button type="button" data-tab="calendar"><span aria-hidden="true">▦</span><span>Calendario Ritchie</span></button>
      <button type="button" data-tab="inbox"><span aria-hidden="true">▤</span><span>Avisos</span></button>
      <button type="button" data-tab="history"><span aria-hidden="true">◷</span><span>Historial</span></button>
      <button type="button" data-tab="chat"><span aria-hidden="true">◫</span><span>Chat Riwi</span></button>
    </nav>
    <main>
      <p id="status" class="status" role="status">Cargando tu tablero…</p>
      <div id="sources"></div>
      <section id="check" aria-label="Hoy y checklist" hidden></section>
      <section id="calendar" aria-label="Calendario Ritchie" hidden></section>
      <section id="inbox" aria-label="Avisos" hidden></section>
      <section id="history" aria-label="Historial" hidden></section>
      <section id="chat" aria-label="Chat Riwi" hidden>
        <h2 id="chat-title">Chat Riwi</h2>
        <div id="chat-context"></div>
        <details class="card" id="chat-connection">
          <summary>Conectar un modelo</summary>
          <form id="model-form">
            <label for="provider">Proveedor</label>
            <select id="provider">
              <option value="gemini">Google Gemini · clave de API</option>
              <option value="google-cloud">Google Cloud · cuenta de Google</option>
              <option value="openai">OpenAI · clave de API</option>
              <option value="claude">Claude · clave de API</option>
              <option value="ollama">Ollama en este dispositivo</option>
              <option value="agent">Agente local · API compatible con OpenAI</option>
            </select>
            <p id="provider-hint"></p>
            <label for="model">Nombre del modelo o agente</label>
            <input id="model" required maxlength="120" autocomplete="off">
            <div id="project-field" hidden>
              <label for="project">ID del proyecto de Google Cloud</label>
              <input id="project" maxlength="30" autocomplete="off">
            </div>
            <div id="credential-field">
              <label for="credential">Clave de API</label>
              <input type="password" id="credential" maxlength="4096" autocomplete="off">
            </div>
            <div id="port-field" hidden>
              <label for="local-port">Puerto local</label>
              <input type="number" id="local-port" min="1" max="65535">
            </div>
            <label id="usage-field" class="check"><input type="checkbox" id="usage-consent"> <span>Autorizo enviar el contexto y el historial de este chat al proveedor y usar mi cuota o saldo. Mi proveedor puede generar cargos.</span></label>
            <div class="row"><button id="connect-model" type="submit">Conectar</button><button id="disconnect-model" type="button" class="secondary" hidden>Desconectar</button></div>
            <p id="connection-status" role="status" class="status"></p>
          </form>
        </details>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="ask" class="card">
          <p id="active-model" class="muted">Conecta un modelo para enviar preguntas.</p>
          <label for="question">Tu pregunta</label>
          <textarea id="question" maxlength="4000" required placeholder="Escribe tu pregunta sobre este día"></textarea>
          <button id="send" disabled>Enviar pregunta</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
