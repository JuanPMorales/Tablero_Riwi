<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingresar · Mi tablero Riwi</title>
  <link rel="stylesheet" href="/ui.css">
  <script defer src="/login.js"></script>
</head>
<body>
  <main class="login-page">
    <div class="brand"><span class="brand-mark" aria-hidden="true">R</span><div><h1>Mi tablero Riwi</h1><small>Desarrollo de Software · Clan Ritchie</small></div></div>
    <section class="card">
      <h2 id="login-heading">Iniciar sesión</h2>
      <form id="account-form" method="post">
        <label for="document">Cédula</label>
        <input id="document" name="document" inputmode="numeric" autocomplete="username" required pattern="[0-9]{5,12}" maxlength="12">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        <p id="password-hint" hidden>Usa al menos 12 caracteres.</p>
        <details id="claim" hidden>
          <summary>Recuperar mi avance anterior</summary>
          <label for="previous">Contraseña anterior del tablero</label>
          <input id="previous" name="previous" type="password" autocomplete="off" maxlength="512" disabled>
        </details>
        <button id="submit-account" type="submit">Entrar</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
      <button id="toggle-account" class="secondary" type="button">Crear una cuenta</button>
    </section>
  </main>
</body>
</html>
